name: Personal CI

# Fast gates for the personal fork branch: formatting, types, translations
# and a renderer bundle. Runs on every push and on PRs targeting the branch
# (including the upstream-sync PRs). The full test suite is intentionally NOT
# run here — several cases take 10+ minutes each; run `npm test` locally.

on:
  push:
    branches: [personal/windows-dictation]
  pull_request:
    branches: [personal/windows-dictation]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Quality checks (eslint + prettier + tsc)
        run: npm run quality-check

      - name: Check translations
        run: npm run i18n:check

      - name: Build renderer
        run: npm run build:renderer
